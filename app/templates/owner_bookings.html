<h2>📑 My Property Bookings</h2>

{% if bookings %}
<table border="1" cellpadding="8">
    <tr>
        <th>Property</th>
        <th>Buyer</th>
        <th>Deal</th>
        <th>Amount</th>
        <th>Status</th>
        <th>Date</th>
    </tr>

    {% for b in bookings %}
    <tr>
        <td>{{ b[1] }}</td>
        <td>{{ b[2] }}</td>
        <td>{{ b[3] }}</td>
        <td>₹{{ b[4] }}</td>
        <td>{{ b[5] }}</td>
        <td>{{ b[6] }}</td>
    </tr>
    {% endfor %}
</table>
{% else %}
<p>No bookings yet.</p>
{% endif %}

<br>
<a href="{{ url_for('owner.owner_dashboard') }}">⬅ Back to Dashboard</a>
